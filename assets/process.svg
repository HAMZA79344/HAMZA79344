<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">How I work</title>
  <desc id="desc">1. Understand the workflow: define the business rules, constraints, and edge cases before development. 2. Build with purpose: use WordPress conventions and keep custom logic clear and maintainable. 3. Test the real journey: check the frontend experience and the functionality behind it. 4. Make the handover useful: explain what changed and how to manage it.</desc>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes drift-a { to { transform: translate(60px, 40px); } }
    @keyframes drift-b { to { transform: translate(-70px, -30px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateX(-10px); } 4% { opacity: 1; transform: translateX(0); } 88% { opacity: 1; transform: translateX(0); } 95%, 100% { opacity: 0; transform: translateX(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.95; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes ring { 0% { transform: scale(1); opacity: 0.75; } 22% { transform: scale(1.45); opacity: 0; } 100% { transform: scale(1.45); opacity: 0; } }
    .ring { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .orb-a { animation: drift-a 16s ease-in-out infinite alternate; }
      .orb-b { animation: drift-b 20s ease-in-out infinite alternate; }
      .flow { animation: flow 1.2s linear infinite; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 6s ease-out infinite both; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F1A2E"/>
      <stop offset="1" stop-color="#150F2E"/>
    </linearGradient>
    <radialGradient id="gTeal"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.42"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gViolet"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.7" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="1200" height="290" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1200" height="290" rx="24"/></clipPath>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.8"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="290" fill="url(#bg)"/>
    <rect width="1200" height="290" fill="url(#grid)" mask="url(#fade)"/>
    <circle class="orb-a" cx="156" cy="44" r="209" fill="url(#gTeal)"/>
    <circle class="orb-b" cx="1080" cy="276" r="232" fill="url(#gViolet)"/>
    <path d="M150 108H1050" stroke="#334155" stroke-width="2" stroke-dasharray="6 8"/>
    <path class="flow" d="M150 108H1050" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
    <g>
      <circle r="16" fill="url(#halo)"/>
      <circle r="5" fill="#5EEAD4"/>
      <animateMotion path="M150 108H1050" dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.72;0.8;1" dur="6s" repeatCount="indefinite"/>
    </g>
    
    <circle class="ring" style="animation-delay:0s" cx="150" cy="108" r="44" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="150" cy="108" r="44" fill="#0A1120" stroke="url(#nodeGrad)" stroke-width="2.5"/>
    <circle cx="150" cy="108" r="34" fill="#2DD4BF" fill-opacity="0.07"/>
    <g transform="translate(133.2 91.2) scale(1.4)" fill="none" stroke="#5EEAD4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g>
    <circle cx="182" cy="76" r="14" fill="url(#accent)" stroke="#0A1120" stroke-width="3"/>
    <text class="sans" x="182" y="80.5" font-size="13" font-weight="800" fill="#0A1120" text-anchor="middle">1</text>
    <text class="sans" x="150" y="196" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">Understand the workflow</text>
    <text class="sans" x="150" y="226" font-size="15" fill="#94A3B8" text-anchor="middle">Business rules, constraints</text>
    <text class="sans" x="150" y="248" font-size="15" fill="#94A3B8" text-anchor="middle">&amp; edge cases, before any code</text>
    <circle class="ring" style="animation-delay:1.5s" cx="450" cy="108" r="44" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="450" cy="108" r="44" fill="#0A1120" stroke="url(#nodeGrad)" stroke-width="2.5"/>
    <circle cx="450" cy="108" r="34" fill="#2DD4BF" fill-opacity="0.07"/>
    <g transform="translate(433.2 91.2) scale(1.4)" fill="none" stroke="#5EEAD4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
    <circle cx="482" cy="76" r="14" fill="url(#accent)" stroke="#0A1120" stroke-width="3"/>
    <text class="sans" x="482" y="80.5" font-size="13" font-weight="800" fill="#0A1120" text-anchor="middle">2</text>
    <text class="sans" x="450" y="196" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">Build with purpose</text>
    <text class="sans" x="450" y="226" font-size="15" fill="#94A3B8" text-anchor="middle">WordPress conventions,</text>
    <text class="sans" x="450" y="248" font-size="15" fill="#94A3B8" text-anchor="middle">clear, maintainable logic</text>
    <circle class="ring" style="animation-delay:3s" cx="750" cy="108" r="44" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="750" cy="108" r="44" fill="#0A1120" stroke="url(#nodeGrad)" stroke-width="2.5"/>
    <circle cx="750" cy="108" r="34" fill="#2DD4BF" fill-opacity="0.07"/>
    <g transform="translate(733.2 91.2) scale(1.4)" fill="none" stroke="#5EEAD4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g>
    <circle cx="782" cy="76" r="14" fill="url(#accent)" stroke="#0A1120" stroke-width="3"/>
    <text class="sans" x="782" y="80.5" font-size="13" font-weight="800" fill="#0A1120" text-anchor="middle">3</text>
    <text class="sans" x="750" y="196" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">Test the real journey</text>
    <text class="sans" x="750" y="226" font-size="15" fill="#94A3B8" text-anchor="middle">The frontend experience</text>
    <text class="sans" x="750" y="248" font-size="15" fill="#94A3B8" text-anchor="middle">and the functionality behind it</text>
    <circle class="ring" style="animation-delay:4.5s" cx="1050" cy="108" r="44" fill="none" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="1050" cy="108" r="44" fill="#0A1120" stroke="url(#nodeGrad)" stroke-width="2.5"/>
    <circle cx="1050" cy="108" r="34" fill="#2DD4BF" fill-opacity="0.07"/>
    <g transform="translate(1033.2 91.2) scale(1.4)" fill="none" stroke="#5EEAD4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></g>
    <circle cx="1082" cy="76" r="14" fill="url(#accent)" stroke="#0A1120" stroke-width="3"/>
    <text class="sans" x="1082" y="80.5" font-size="13" font-weight="800" fill="#0A1120" text-anchor="middle">4</text>
    <text class="sans" x="1050" y="196" font-size="20" font-weight="700" fill="#F8FAFC" text-anchor="middle">Make the handover useful</text>
    <text class="sans" x="1050" y="226" font-size="15" fill="#94A3B8" text-anchor="middle">What changed, and</text>
    <text class="sans" x="1050" y="248" font-size="15" fill="#94A3B8" text-anchor="middle">how to manage it</text>
    <rect x="0" y="286" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
