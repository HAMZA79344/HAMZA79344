<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation" aria-hidden="true">
  <style>
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1400px); } }
    @keyframes beat { 0%, 100% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.25); } }
    @media (prefers-reduced-motion: no-preference) {
      .shine { animation: sweep 4.5s ease-in-out infinite; }
      .gem { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    }
    .gem { transform-box: fill-box; transform-origin: center; transform: rotate(45deg); }
  </style>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="0.75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="track"><rect x="0" y="11" width="1200" height="2"/></clipPath>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)"/>
  <g clip-path="url(#track)"><rect class="shine" x="-200" y="11" width="200" height="2" fill="url(#shineGrad)"/></g>
  <circle cx="570" cy="12" r="2.5" fill="#2DD4BF"/>
  <circle cx="630" cy="12" r="2.5" fill="#A78BFA"/>
  <rect class="gem" x="593" y="5" width="14" height="14" rx="2" fill="url(#gemGrad)"/>
</svg>
